tool.piper.model.config=C:\\piper\\voices\\en_US-amy-medium.onnx.json

# --- Temp & Cleanup ---
temp.dir=C:\\Users\\admin\\temp
cleanup.downloads=true
cleanup.temp.audio=true

# --- Logging ---
logging.level=INFO
logging.file=C:\\Users\\admin\\logs\\video-processor.log