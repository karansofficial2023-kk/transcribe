# ============================================
# VIDEO PROCESSING - WINDOWS CPU CONFIG
# ============================================

# --- Input ---
# Type: folder | url | urlfile
video.input.type=folder
video.input.folder=C:\\Users\\User\\Videos
video.input.watch=true

# --- Output ---
video.output.dir=C:\\Users\\User\\output

# --- Processing ---
video.processing.mode=sequential
video.processing.threads=1
video.language=auto
video.rephrase.style=professional

# --- Tool Paths (UPDATE THESE TO YOUR ACTUAL PATHS) ---
tool.ffmpeg.path=C:\\Users\\User\\Documents\\Codex\\Tools\\Transcribe\\ffmpeg\\ffmpeg-9.0.1-essentials_build\\bin\\ffmpeg.exe
tool.ffprobe.path= C:\\Users\\User\\Documents\\Codex\\Tools\\Transcribe\\ffmpeg\\ffmpeg-9.0.1-essentials_build\\bin\\ffprobe.exe
# Find your Python path: where python
tool.python.path= C:\\Users\\User\\AppData\\Local\\Microsoft\\WindowsApps\\python3.exe
# Where you saved whisper_transcribe.py
tool.whisper.script=D:\\JAVA\\transcribe\\transcribe\\whisper_transcribe.py

# CPU mode for testing (change to cuda when you get GPU)
tool.whisper.model=base
tool.whisper.device=cuda

# Ollama (must be running: ollama serve)
tool.ollama.url=http://localhost:11434
tool.ollama.model=qwen3:8b

# Paraphrase validation retry gate
validation.threshold=80
validation.max.retries=3

# Storyboard visual style
# true  = allow local diagrams/animations/cards for teaching clarity
# false = prefer real HD photos/photo labels and generated video; avoid local animation/card-style visuals
storyboard.animation.enabled=false
# Active generated-video provider for storyboard wording: ltx, wan, or all
storyboard.video.provider=ltx

# Piper TTS
#tool.piper.path=C:\\piper\\piper.exe
#tool.piper.model=C:\\piper\\voices\\en_US-amy-medium.onnx
#tool.piper.model.config=C:\\piper\\voices\\en_US-amy-medium.onnx.json

# TTS Provider: "piper" or "edge"
tts.provider=edge

# Edge TTS settings
tool.edge_tts.script=./edge_tts_wrapper.py
tool.edge_tts.voice=en-IN-NeerjaNeural
tool.edge_tts.rate=-20%
#tts.provider=piper
#tool.piper.path=piper
#tool.piper.model=/path/to/model.onnx

# Speed options:
# +0%   = Normal speed
# +50%  = 1.5x faster
# +100% = 2x faster
# -25%  = Slightly slower
# -50%  = Half speed

# --- Temp & Cleanup ---
temp.dir=C:\\Users\\User\\temp
cleanup.downloads=true
cleanup.temp.audio=true

# --- Logging ---
logging.level=INFO
logging.file=C:\\Users\\User\\logs\\video-processor.log




