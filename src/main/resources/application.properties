# ============================================
# VIDEO PROCESSING - WINDOWS CPU CONFIG
# ============================================

# --- Input ---
# Type: folder | url | urlfile
video.input.type=folder
video.input.folder=C:\\Users\\admin\\Videos
video.input.watch=true

# --- Output ---
video.output.dir=C:\\Users\\admin\\output

# --- Processing ---
video.processing.mode=sequential
video.processing.threads=1
video.language=auto
video.rephrase.style=professional

# --- Tool Paths (UPDATE THESE TO YOUR ACTUAL PATHS) ---
tool.ffmpeg.path=C:\\Users\\admin\\AppData\\Local\\Microsoft\\WinGet\\Packages\\Gyan.FFmpeg.Shared_Microsoft.Winget.Source_8wekyb3d8bbwe\\ffmpeg-9.0.1-full_build-shared\\bin\\ffmpeg.exe
tool.ffprobe.path=C:\\Users\\admin\\AppData\\Local\\Microsoft\\WinGet\\Packages\\Gyan.FFmpeg.Shared_Microsoft.Winget.Source_8wekyb3d8bbwe\\ffmpeg-9.0.1-full_build-shared\\bin\\ffprobe.exe

# Find your Python path: where python
tool.python.path=C:\\Users\\admin\\AppData\\Local\\Programs\\Python\\Python312\\python.exe

# Where you saved whisper_transcribe.py
tool.whisper.script=E:\\JAVA\\transcribe\\transcribe\\whisper_transcribe.py

# CPU mode for testing (change to cuda when you get GPU)
tool.whisper.model=base
