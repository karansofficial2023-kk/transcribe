# ============================================
# VIDEO PROCESSING - WINDOWS CPU CONFIG
# ============================================

# --- Input ---
# Type: folder | url | urlfile
video.input.type=folder
video.input.folder=C:\\Users\\User\\Videos
video.input.watch=true

# --- Output ---
video.output.dir=C:\\Users\\User\\output

# --- Processing ---
video.processing.mode=sequential
video.processing.threads=1
video.language=auto
video.rephrase.style=professional

# --- Tool Paths (UPDATE THESE TO YOUR ACTUAL PATHS) ---
tool.ffmpeg.path=C:\\Users\\User\\Documents\\Codex\\Tools\\Transcribe\\ffmpeg\\ffmpeg-9.0.1-essentials_build\\bin\\ffmpeg.exe
tool.ffprobe.path= C:\\Users\\User\\Documents\\Codex\\Tools\\Transcribe\\ffmpeg\\ffmpeg-9.0.1-essentials_build\\bin\\ffprobe.exe
# Find your Python path: where python
tool.python.path=D:\\AI\\ComfyUI_windows_portable\\python_embeded\\python.exe
# Where you saved whisper_transcribe.py
tool.whisper.script=./whisper_transcribe.py

# CPU mode for testing (change to cuda when you get GPU)
tool.whisper.model=large-v3
tool.whisper.device=cuda

# Ollama (must be running: ollama serve)
tool.ollama.url=http://localhost:11434
tool.ollama.model=qwen3:14b

# Paraphrase validation retry gate
validation.threshold=80
validation.max.retries=3

# Storyboard visual style
# true  = allow local diagrams/animations/cards for teaching clarity
# false = prefer real HD photos/photo labels and generated video; avoid local animation/card-style visuals
storyboard.animation.enabled=true
# Active generated-video provider for storyboard wording: ltx, wan, or all
storyboard.video.provider=ltx
# false = transcript-only storyboard; true = teacher-style curriculum-expanded storyboard
storyboard.curriculum.enrichment=true
# Optional project evidence folder. Use {baseName} to isolate queued lessons, for example:
# storyboard.materials.dir=C:\\Users\\User\\storyboard_materials\\{baseName}
storyboard.materials.dir=C:\\Users\\User\\Desktop\\Input

# Piper TTS
#tool.piper.path=C:\\piper\\piper.exe
#tool.piper.model=C:\\piper\\voices\\en_US-amy-medium.onnx
#tool.piper.model.config=C:\\piper\\voices\\en_US-amy-medium.onnx.json

# Storyboard-only production mode. Set true only when a separate narration
# audio file is required from this Transcribe pipeline.
tts.enabled=false

# TTS Provider: "piper" or "edge" (used only when tts.enabled=true)
tts.provider=edge

# Edge TTS settings
tool.edge_tts.script=./edge_tts_wrapper.py
tool.edge_tts.voice=en-IN-NeerjaNeural
tool.edge_tts.rate=-20%
#tts.provider=piper
#tool.piper.path=piper
#tool.piper.model=/path/to/model.onnx

# Speed options:
# +0%   = Normal speed
# +50%  = 1.5x faster
# +100% = 2x faster
# -25%  = Slightly slower
# -50%  = Half speed

# --- Temp & Cleanup ---
temp.dir=C:\\Users\\User\\temp
cleanup.downloads=true
cleanup.temp.audio=true

# --- Logging ---
logging.level.root=INFO
logging.file.name=C:\\Users\\User\\logs\\video-processor.log





# Editorial visual-director pass: specific image prompts, narration-supported labels and step lists per shot
storyboard.visual.director=true

# Fast model for structured storyboard planning (fits fully in 12 GB VRAM); main model keeps paraphrase/fact-audit
tool.ollama.model.fast=qwen3:8b
ollama.think=false
ollama.temperature=0.2
ollama.num_ctx=12288
ollama.keep_alive=20m

# Curriculum enrichment adds content only from approved materials in storyboard.materials.dir (never from model memory) unless this is true
storyboard.curriculum.enrichment.allow_model_knowledge=false

# Cached model answers (keyed by the full request). Re-running a lesson reuses unchanged answers; delete the folder to start fresh.
ollama.cache.dir=./llm_cache
# Extra storyboard languages written after the main one, translated (not re-planned): e.g. ta,te,hi
storyboard.target.languages=

# Storyboard translation: madlad = offline MADLAD-400 3B worker (Apache-2.0), ollama = local Qwen, auto = madlad when installed
translation.engine=auto
tool.translate.script=./translate_text.py
tool.translate.model.dir=D:\\AI\\models\\madlad400-3b-mt

# Per-language recognition models (CTranslate2 folders): measured on real read speech they cut word errors from 49% to 21% (Tamil) and
# from 71% to 24% (Telugu). Convert with ct2-transformers-converter, see docs/LANGUAGES_AND_VERIFICATION.md.
tool.whisper.specialists=ta=D:\\AI\\models\\asr\\whisper-tamil-large-v2-ct2;te=D:\\AI\\models\\asr\\whisper-telugu-large-v2-ct2
